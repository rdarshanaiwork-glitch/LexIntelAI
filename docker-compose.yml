version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lexintel_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://lexuser:lexpass@postgres:5432/lexintel
      - LLM_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - SECRET_KEY=lexintel_docker_secret_jwt_key_2025
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lexintel_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

  postgres:
    image: postgres:15-alpine
    container_name: lexintel_postgres
    environment:
      POSTGRES_DB: lexintel
      POSTGRES_USER: lexuser
      POSTGRES_PASSWORD: lexpass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lexuser -d lexintel"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: